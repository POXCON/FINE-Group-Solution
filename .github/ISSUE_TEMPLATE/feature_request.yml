name: "✨ 機能追加 (Feature)"
description: 新機能・機能改善の提案
title: "feat: "
labels: ["type:feature"]
body:
  - type: dropdown
    id: system
    attributes:
      label: 対象システム
      options:
        - invoice-search
        - (新規システム)
        - 共通 / モノレポ全体
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 概要 / 背景
      description: 何を・なぜ実現したいか。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件 (Acceptance Criteria)
      description: 完了とみなす条件をチェックリストで。
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 対象レイヤ
      multiple: true
      options:
        - frontend
        - backend
        - middleend
        - infra
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options: ["high", "medium", "low"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足 (参考実装・依存・リスク)
