name: CI

# モノレポ共通 CI。各システムの frontend/ backend/ を自動検出して品質ゲートを実行する。
# 構成が固まったらシステム単位の path フィルタ / matrix に最適化すること。

on:
  pull_request:
    branches:
      - main
      - develop
      - "develop-*"
  push:
    branches:
      - main
      - develop

jobs:
  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run checks for each frontend
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for pkg in */frontend/package.json; do
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            ( cd "$dir" && npm ci && npm run lint && npm run test --if-present && npm run build )
            echo "::endgroup::"
            found=1
          done
          [ "$found" = 0 ] && echo "No frontend project found — skipping." || true

  backend:
    name: Backend (ruff / black / mypy / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Run checks for each backend
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for req in */backend/requirements.txt; do
            dir=$(dirname "$req")
            echo "::group::$dir"
            ( cd "$dir" \
              && python -m pip install --upgrade pip \
              && pip install -r requirements.txt \
              && pip install ruff black mypy pytest pytest-cov \
              && ruff check . \
              && black --check . \
              && (mypy . || true) \
              && pytest --cov --cov-report=term-missing )
            echo "::endgroup::"
            found=1
          done
          [ "$found" = 0 ] && echo "No backend project found — skipping." || true

  e2e:
    name: E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Playwright E2E for each frontend
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for pkg in */frontend/package.json; do
            dir=$(dirname "$pkg")
            echo "::group::E2E $dir"
            (
              cd "$dir"
              npm ci
              # Playwright ブラウザ（Chromium のみ）のインストール
              npx playwright install --with-deps chromium
              # Cognito 未設定時は mockAuthClient が自動で使われる
              VITE_API_BASE_URL=http://localhost:5173 npx playwright test \
                --project=chromium-desktop \
                --reporter=github
            )
            echo "::endgroup::"
            found=1
          done
          [ "$found" = 0 ] && echo "No frontend project found — skipping." || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            */frontend/playwright-report/
            */frontend/test-results/
          retention-days: 7
