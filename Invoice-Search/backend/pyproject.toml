[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]
# B008: FastAPI の Depends() を引数デフォルトに置くのは標準パターンのため除外
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 非推奨 API の混入を防ぐため DeprecationWarning はエラー扱いにする。
# 特定の第三者ライブラリの警告を許容する必要が生じた場合のみ ignore を追記する。
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
